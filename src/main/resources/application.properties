spring.application.name=restaurant
# Carga las variables del fichero .env (claves de Stripe) sin subirlas al repositorio
spring.config.import=optional:file:.env[.properties]


# Core 
spring.profiles.active=h2

# base endpoint configs
api-endpoint = api/v1

# Cookie SameSite configuration:  "Lax", "None" or "Strict"   
cookie-same-site =${COOKIE_SAME_SITE:None}

# CORS
frontend-domain = ${FRONTEND_DOMAIN:https://localhost:5173}

# jwt secrets
jwt-secret=${JWT_SECRET:0kuSAcoQ7qpnLOO92S2VCrkc8g2tiDrWgZ5V+lzYWqA=}
access-token-duration-minutes=${ACCESS_TOKEN_DURATION_MINUTES:5}
refresh-token-duration-days=${REFRESH_TOKEN_DURATION_DAYS:30}

# SSL config (ones for localhost were created by mkcert)
server.ssl.key-store=${SSL_KEYSTORE_PATH: file:.certs/localhost+1.p12 }
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.port=8443

# Docker
spring.docker.compose.enabled=false

# Pago con Stripe (GS-341): la clave secreta y las URLs de vuelta al frontend
stripe.api.key=${STRIPE_API_KEY:}
stripe.success.url=${STRIPE_SUCCESS_URL:http://localhost:5173/success}
stripe.cancel.url=${STRIPE_CANCEL_URL:http://localhost:5173/cancel}

# Daily sales report cloud storage (Supabase Storage)
sales-report.cron=${SALES_REPORT_CRON:0 0 0 * * *}
sales-report.zone=${SALES_REPORT_ZONE:Europe/Madrid}
sales-report.retry-attempts=${SALES_REPORT_RETRY_ATTEMPTS:3}
sales-report.retry-delay-ms=${SALES_REPORT_RETRY_DELAY_MS:5000}
sales-report.admin-webhook=${SALES_REPORT_ADMIN_WEBHOOK:}
cloud.supabase.url=${SUPABASE_URL:}
cloud.supabase.bucket=${SUPABASE_STORAGE_BUCKET:}
cloud.supabase.api-key=${SUPABASE_API_KEY:}
